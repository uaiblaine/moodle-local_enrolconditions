# Mutation spec for local_enrolconditions - run with
#   mdl mutate moodle-local_enrolconditions moodle-local_enrolconditions/mutations/gates.conf --fast
#
# Each gate breaks ONE guard; the `#   ->` lines name the tests that must go red because of it.
# A gate with no `#   ->` line is a guard no test is known to hold: that is the finding, not an omission.
#
#     tag | file relative to the repo | perl script relative to this file


